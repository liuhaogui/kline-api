services:
  kline-api:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    restart: unless-stopped
    init: true
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${PORT:-8082}:8082"
    environment:
      LISTEN_ADDR: ":8082"
      API_PREFIX: ${API_PREFIX:-/trade/api/v1}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-12s}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-15s}
      MAX_WS_CONNECTIONS: ${MAX_WS_CONNECTIONS:-256}
      MAX_WS_SUBSCRIPTIONS: ${MAX_WS_SUBSCRIPTIONS:-32}
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
