# Install in /etc/nginx/conf.d/kline-api.conf, inside nginx's http {} context.
# Replace server_name, and add your own TLS configuration for HTTPS/WSS.
map $http_upgrade $kline_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name example.com;

    location = /healthz {
        proxy_pass http://127.0.0.1:8082;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    # Preserve the full URI. Do not strip /trade/ with a trailing-slash proxy_pass.
    location ~ ^/(trade/)?api/v1/kline/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $kline_connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }
}
